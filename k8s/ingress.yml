apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: guestbook-dev
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx

  rules:
    - host: guestbook.local.com
      http:
        paths:
          - path: /guestbook
            pathType: Prefix
            backend:
              service:
                name: flask-service
                port:
                  number: 80
