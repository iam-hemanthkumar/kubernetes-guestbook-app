# CONFIGMAP

apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: guestbook-dev
data:
  MYSQL_DATABASE: guestbook
  MYSQL_USER: guestbook

---

# SERVICE

apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: guestbook-dev
spec:
  selector:
    app.kubernetes.io/name: mysql 
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306

---

# PVC

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: guestbook-dev

spec:
  storageClassName: standard
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 10Gi

---

# DEPLOYMENT

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: guestbook-dev
  labels:
    app.kubernetes.io/name: mysql

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: mysql

  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql

    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          envFrom:
            - configMapRef:
                name: mysql-config
            - secretRef:
                name: mysql-secret

          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql

      volumes:
      - name: mysql-storage
        persistentVolumeClaim:
          claimName: mysql-pvc
