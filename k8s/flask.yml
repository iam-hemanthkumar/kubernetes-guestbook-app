# CONFIGMAP

apiVersion: v1
kind: ConfigMap
metadata:
  name: flask-config
  namespace: guestbook-dev

data:
  DB_HOST: mysql-service
  DB_PORT: "3306"
  DB_NAME: guestbook
  DB_USER: guestbook

---

# SERVICE

apiVersion: v1
kind: Service
metadata:
  name: flask-service
  namespace: guestbook-dev
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flask
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000

---

# DEPLOYMENT

apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask
  namespace: guestbook-dev
  labels:
    app.kubernetes.io/name: flask

spec:
  replicas: 3

  selector:
    matchLabels:
      app.kubernetes.io/name: flask

  template:
    metadata:
      labels:
        app.kubernetes.io/name: flask

    spec:
      containers:
        - name: flask
          image: python-app:v1
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef: 
                name: flask-config
            - secretRef:
                name: flask-secret

                    
